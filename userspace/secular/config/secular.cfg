// secular.cfg — NS physical memory map (JSON5)
// Packed as /boot/config/secular.cfg.
//
// Numbers: JSON number, or string "0x.." / decimal with optional K/M/G (1024).
// paddr 0 = allocate a contiguous NS buffer of `size`. Non-zero paddr is a
// reserved PA; the client still allocates unless PMM carved that range.
//
// windows[]   NS shared RAM (TIPC, mailbox). CPU-cached.
//               role: "tipc" | "mailbox" | "shared"
// devices[]   passthrough MMIO: guest GPA = HPA (stage-2 identity).
//               irq    GIC SPI (32+n). omit = no IRQ passthrough
//               sid    SMMU stream id. omit on QEMU virt
//               dma    "none" | "identity" | "nested"
//               cache  "device" | "cached"
//               guest  vmid | "*" | "host"   (* = every guest)
// reserve[]   carveout: not for PMM, not for guests unless also in devices[]
// ram[]       guest RAM at a fixed IPA (size still comes from linux.cfg / rtos.cfg)
//
// Guest vmid: 0 = rtos, 1 = linux (guest_manager).
// QEMU virt host console is PL011 at 0x09000000 — do not passthrough it.

{
  version: 1,
  windows: [
    { name: "tipc0", paddr: 0, size: "4K", role: "tipc" },
  ],
  devices: [
    // Example: dedicated UART for Linux, not the host console.
    // { name: "uart1", paddr: "0x09040000", size: "4K", irq: 39, guest: 1, dma: "none", cache: "device" },
  ],
  reserve: [
    // Example: Trusty carveout if BL32 is given a fixed NS PA.
    // { name: "trusty", paddr: "0x7fe00000", size: "64K", owner: "trusty" },
  ],
  ram: [],
}
